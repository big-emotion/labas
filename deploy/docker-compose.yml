# Là-bas — nginx container behind the host-level Traefik, same convention as ethniafrica and
# big-emotion on this VPS: one compose project per application, joined to the external
# `proxy` network. CI loads the image as labas:live and restarts this service.
services:
  labas:
    image: labas:live
    container_name: labas
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.labas.loadbalancer.server.port=80"
      # HTTPS — Traefik's existing ACME resolver issues the certificate on first request,
      # so DNS must already point at this host (docs/deploy.md).
      - "traefik.http.routers.labas.rule=Host(`labas.africa`) || Host(`www.labas.africa`)"
      - "traefik.http.routers.labas.entrypoints=websecure"
      - "traefik.http.routers.labas.tls.certresolver=myresolver"
      - "traefik.http.routers.labas.middlewares=labas-www"
      # www → apex, so the site has one address.
      - "traefik.http.middlewares.labas-www.redirectregex.regex=^https://www\\.labas\\.africa/(.*)"
      - "traefik.http.middlewares.labas-www.redirectregex.replacement=https://labas.africa/$${1}"
      - "traefik.http.middlewares.labas-www.redirectregex.permanent=true"
      # HTTP → HTTPS.
      - "traefik.http.routers.labas-http.rule=Host(`labas.africa`) || Host(`www.labas.africa`)"
      - "traefik.http.routers.labas-http.entrypoints=web"
      - "traefik.http.routers.labas-http.middlewares=labas-https"
      - "traefik.http.middlewares.labas-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.labas-https.redirectscheme.permanent=true"

networks:
  proxy:
    external: true
