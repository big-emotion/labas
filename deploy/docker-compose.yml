# Là-bas — nginx container behind the host-level Traefik, same convention as ethniafrica and
# big-emotion on this VPS: one compose project per application, joined to the external
# `proxy` network. CI loads the image as labas:live and restarts this service.
services:
  labas:
    image: labas:live
    container_name: labas
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.labas.loadbalancer.server.port=80"
      # HTTPS — Traefik's existing ACME resolver issues the certificate on first request,
      # so DNS must already point at this host (docs/deploy.md).
      - "traefik.http.routers.labas.rule=Host(`labas.africa`) || Host(`www.labas.africa`)"
      - "traefik.http.routers.labas.entrypoints=websecure"
      - "traefik.http.routers.labas.tls.certresolver=myresolver"
      - "traefik.http.routers.labas.middlewares=labas-www"
      # www → apex, so the site has one address.
      - "traefik.http.middlewares.labas-www.redirectregex.regex=^https://www\\.labas\\.africa/(.*)"
      - "traefik.http.middlewares.labas-www.redirectregex.replacement=https://labas.africa/$${1}"
      - "traefik.http.middlewares.labas-www.redirectregex.permanent=true"
      # HTTP → HTTPS.
      - "traefik.http.routers.labas-http.rule=Host(`labas.africa`) || Host(`www.labas.africa`)"
      - "traefik.http.routers.labas-http.entrypoints=web"
      - "traefik.http.routers.labas-http.middlewares=labas-https"
      - "traefik.http.middlewares.labas-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.labas-https.redirectscheme.permanent=true"

  # The mail service (src/server/subscribe.ts). Traefik sends it /api/nouveautes and /api/resultats;
  # everything else stays with the static site. Its Mailjet secrets come from .env.subscribe,
  # which CI writes from the repository secrets on each deploy.
  labas-subscribe:
    image: labas-subscribe:live
    container_name: labas-subscribe
    restart: unless-stopped
    env_file: .env.subscribe
    networks:
      - proxy
      - labas-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.labas-subscribe.loadbalancer.server.port=8080"
      - "traefik.http.routers.labas-subscribe.rule=Host(`labas.africa`) && (PathPrefix(`/api/nouveautes`) || Path(`/api/resultats`) || PathPrefix(`/api/compte`))"
      - "traefik.http.routers.labas-subscribe.priority=100"
      - "traefik.http.routers.labas-subscribe.entrypoints=websecure"
      - "traefik.http.routers.labas-subscribe.tls.certresolver=myresolver"

  # Saved journeys (src/server/accounts.ts). Reachable only from labas-subscribe, never from the
  # proxy. Started by CI only once LABAS_DB_PASSWORD exists; its data lives in the named volume,
  # which a redeploy never touches (backups: docs/deploy.md).
  labas-db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    container_name: labas-db
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - labas-db:/var/lib/postgresql/data
    networks:
      - labas-internal

networks:
  proxy:
    external: true
  labas-internal:
    internal: true

volumes:
  labas-db:
