# Traefik terminates TLS and redirects HTTP; nginx only serves the built files.
# This file lands in conf.d/, inside nginx's http block: the settings and headers before the
# server blocks apply to both domains, so the two can never drift apart.

# Behind the TLS proxy nginx sees plain http: relative redirects keep /ville/dakar → /ville/dakar/ on https.
absolute_redirect off;
# The version number only helps someone matching the server against known flaws.
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Security headers. No inline script is allowed (the Plausible queue lives in a file); inline
# style attributes stay allowed, city pages use them for bars. The only other origin is the
# shared Plausible collector, loaded only when PUBLIC_PLAUSIBLE_DOMAIN is set at build time.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.big-emotion.com; connect-src 'self' https://stats.big-emotion.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# labas.africa, and any host nobody named: French at the root, English under /en/.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro fingerprints its assets, so they can be cached for a year. A location with its own
  # add_header drops the inherited ones, so nosniff is repeated.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # nginx's type list has no .webmanifest; browsers expect the manifest's own type.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # The English site lives on overthere.africa; old /en/ links follow it there.
  location = /en { return 301 https://overthere.africa/; }
  location /en/ { rewrite ^/en(/.*)$ https://overthere.africa$1 permanent; }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}

# overthere.africa, the English site.
# The same build serves it: an English address is looked up in the /en/ folder first, so
# /city/dakar/ serves /en/city/dakar/index.html. What is only at the root — /_astro/, /og/,
# /photos/, the icons, the manifest, plausible-queue.js — falls through to $uri. French
# addresses do not collide with English ones (only / is shared, and /en/ wins it).
server {
  listen 80;
  server_name overthere.africa www.overthere.africa;
  root /usr/share/nginx/html;
  index index.html;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # Links built before PUBLIC_EN_ORIGIN was set still carry /en: send them to the bare address.
  location = /en {
    return 301 /;
  }
  location /en/ {
    rewrite ^/en(/.*)$ $1 permanent;
  }

  # The index.html forms come first and "/en$uri/" never appears: a directory match hands the
  # request to the index module, whose internal redirect to /en/…/index.html would meet the /en/
  # redirect above and bounce the reader through an extra 301.
  location / {
    try_files /en${uri}index.html /en$uri/index.html /en$uri.html /en$uri $uri $uri/ =404;
  }
}
