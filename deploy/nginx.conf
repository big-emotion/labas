# Traefik terminates TLS and redirects HTTP; nginx only serves the built files.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. No inline script is allowed (the Plausible queue lives in a file); inline
  # style attributes stay allowed, city pages use them for bars. The only other origin is the
  # shared Plausible collector, loaded only when PUBLIC_PLAUSIBLE_DOMAIN is set at build time.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.big-emotion.com; connect-src 'self' https://stats.big-emotion.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Astro fingerprints its assets, so they can be cached for a year.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
