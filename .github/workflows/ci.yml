name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check

  # The production image must build before a tag can ship it (docs/deploy.md).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t labas:ci .
      - run: docker build --target subscribe -t labas-subscribe:ci .
      - name: the subscribe service starts and stays closed without its secrets
        run: |
          docker run -d --name subscribe -p 8081:8080 labas-subscribe:ci
          sleep 2
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://labas.africa' \
            -d '{"email":"a@exemple.fr","consent":true}' http://localhost:8081/api/nouveautes)
          [ "$status" = "503" ] || { echo "expected 503, got $status"; exit 1; }
      - name: the accounts module migrates a real Postgres and opens
        run: |
          docker network create labas-ci
          docker run -d --name labas-db --network labas-ci -e POSTGRES_USER=labas \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=labas postgres:17-alpine
          for i in $(seq 1 30); do docker exec labas-db pg_isready -U labas >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name subscribe-db --network labas-ci -p 8082:8080 \
            -e MAILJET_API_KEY=k -e MAILJET_SECRET_KEY=s -e MAILJET_LIST_ID=1 \
            -e MAILJET_SENDER=ci@labas.africa -e SUBSCRIBE_SECRET=ci \
            -e DATABASE_URL=postgres://labas:ci@labas-db:5432/labas labas-subscribe:ci
          sleep 3
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/api/compte)
          [ "$status" = "401" ] || { docker logs subscribe-db; echo "expected 401, got $status"; exit 1; }
          docker exec labas-db psql -U labas -d labas -tAc "select count(*) from information_schema.tables where table_name in ('accounts','journeys','login_links','sessions')" | grep -q '^4$'
      - name: nginx accepts its configuration
        run: docker run --rm labas:ci nginx -t
      - name: the image serves the home page
        run: |
          docker run -d --name labas -p 8080:80 labas:ci
          sleep 2
          curl -fsS http://localhost:8080/ | grep -q "<title>"
          curl -fsS -o /dev/null http://localhost:8080/ville/dakar/
      - name: the image serves the security headers
        run: |
          headers=$(curl -fsSI http://localhost:8080/)
          for h in strict-transport-security content-security-policy x-frame-options \
                   x-content-type-options referrer-policy permissions-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "missing $h"; exit 1; }
          done
          echo "$headers" | grep -i "^content-security-policy:" | grep -q "script-src 'self'"
          if echo "$headers" | grep -qiE "^server:.*[0-9]"; then echo "server version exposed"; exit 1; fi
      - name: the image serves the app manifest and redirects folders on the same scheme
        run: |
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -qi "^content-type: application/manifest+json"
          location=$(curl -sSI http://localhost:8080/ville/dakar | grep -i "^location:")
          echo "$location" | grep -q " /ville/dakar/" || { echo "absolute redirect: $location"; exit 1; }

  # The repository is public and agents push to it: scan the whole history for secrets.
  # The gitleaks binary, not its Action, which needs a paid licence for organisation accounts.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner /repo
