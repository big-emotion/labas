name: Deploy production

# Same shape as big-emotion.com on the same VPS: CI builds the image, ships it as a tarball and
# restarts the container behind Traefik. The VPS never builds anything. Production ships on a
# v* tag only; workflow_dispatch redeploys or rolls back to a known-good ref. See docs/deploy.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and deploy"
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://labas.africa
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: make check

      - name: Build Docker images
        run: |
          docker build -t labas:deploy \
            --build-arg PUBLIC_PLAUSIBLE_DOMAIN="${{ vars.PLAUSIBLE_DOMAIN }}" \
            --build-arg PUBLIC_PLAUSIBLE_HOST="${{ vars.PLAUSIBLE_HOST }}" \
            --build-arg PUBLIC_NEWSLETTER="${{ vars.NEWSLETTER }}" \
            --build-arg PUBLIC_EN_ORIGIN="${{ vars.EN_ORIGIN }}" \
            .
          docker build --target subscribe -t labas-subscribe:deploy .

      - name: Export images as compressed tarball
        run: docker save labas:deploy labas-subscribe:deploy | gzip > /tmp/labas.tar.gz

      # The subscribe service's secrets travel as a 600 file, never on a command line.
      - name: Write the subscribe service's environment
        env:
          GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          MAIL_SENDER: ${{ vars.MAIL_SENDER }}
          SUBSCRIBE_SECRET: ${{ secrets.SUBSCRIBE_SECRET }}
          LABAS_DB_PASSWORD: ${{ secrets.LABAS_DB_PASSWORD }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE: ${{ vars.PLAUSIBLE_DOMAIN }}
          PLAUSIBLE_API_HOST: ${{ vars.PLAUSIBLE_API_HOST }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          EN_SITE_URL: ${{ vars.EN_SITE_URL }}
          REPLY_TO_EN: ${{ vars.REPLY_TO_EN }}
        run: |
          umask 077
          database=""
          if [ -n "$LABAS_DB_PASSWORD" ]; then
            database="postgres://labas:$LABAS_DB_PASSWORD@labas-db:5432/labas"
          fi
          {
            echo "GRAPH_TENANT_ID=$GRAPH_TENANT_ID"
            echo "GRAPH_CLIENT_ID=$GRAPH_CLIENT_ID"
            echo "GRAPH_CLIENT_SECRET=$GRAPH_CLIENT_SECRET"
            echo "MAIL_SENDER=$MAIL_SENDER"
            echo "SUBSCRIBE_SECRET=$SUBSCRIBE_SECRET"
            echo "DATABASE_URL=$database"
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "PLAUSIBLE_API_KEY=$PLAUSIBLE_API_KEY"
            echo "PLAUSIBLE_SITE=$PLAUSIBLE_SITE"
            echo "PLAUSIBLE_API_HOST=$PLAUSIBLE_API_HOST"
            echo "DEEPL_API_KEY=$DEEPL_API_KEY"
            echo "EN_SITE_URL=$EN_SITE_URL"
            echo "REPLY_TO_EN=$REPLY_TO_EN"
          } > /tmp/.env.subscribe
          {
            echo "POSTGRES_DB=labas"
            echo "POSTGRES_USER=labas"
            echo "POSTGRES_PASSWORD=$LABAS_DB_PASSWORD"
          } > /tmp/.env.db
          # Only start the database once its password exists.
          if [ -n "$LABAS_DB_PASSWORD" ]; then echo "labas-db" > /tmp/services; else : > /tmp/services; fi

      # Pinned known_hosts — never StrictHostKeyChecking=no.
      - name: Configure deploy SSH key
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      # The compose ships from this checkout so image and compose always match the deployed ref.
      - name: Ship image and compose to the VPS
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ vars.DEPLOY_PORT }} \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            /tmp/labas.tar.gz /tmp/.env.subscribe /tmp/.env.db /tmp/services deploy/docker-compose.yml \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:/home/${{ vars.DEPLOY_USER }}/labas/"

      # The site's images come in the tarball and are never pulled; the database image is pinned by
      # digest from Docker Hub, so the VPS pulls it first or `--pull never` finds nothing.
      - name: Load image and restart the container
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEPLOY_PORT }} \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ~/labas && \
             chmod 600 .env.subscribe .env.db && \
             docker load < labas.tar.gz && \
             docker tag labas:deploy labas:live && \
             docker tag labas-subscribe:deploy labas-subscribe:live && \
             { [ ! -s services ] || docker compose -f docker-compose.yml pull \$(cat services); } && \
             docker compose -f docker-compose.yml up -d --no-deps --pull never labas labas-subscribe \$(cat services) && \
             rm -f labas.tar.gz"

      # Retries for a minute: on a first deploy Traefik is still getting the Let's Encrypt
      # certificate when the container starts, and curl fails with exit 60 meanwhile.
      - name: Smoke check
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' https://labas.africa/ || true)
            if [ "$status" = "200" ]; then exit 0; fi
            echo "attempt $attempt: got '$status', retrying in 5 s"
            sleep 5
          done
          echo "https://labas.africa/ did not answer 200 within a minute" >&2
          exit 1
